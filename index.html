<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Q Barbershop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-[#111827] text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="text-xl font-bold tracking-widest uppercase">The Q Barbershop</div>
        <div class="text-gray-300 hover:text-white cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col items-center mt-12 px-4 w-full max-w-4xl mx-auto">
        
        <!-- VIEW 1: Main Menu -->
        <div id="view-menu" class="w-full text-center flex flex-col items-center animate-fade-in">
            <p class="text-sm text-gray-500 uppercase tracking-widest mb-2">Welcome to</p>
            <h1 class="text-3xl font-extrabold text-gray-900 mb-4 uppercase">The Q Barbershop</h1>
            <p class="text-gray-500 mb-10 max-w-md">Experience the best grooming service in town. Walk in or book your preferred time.</p>

            <div class="flex flex-col sm:flex-row gap-6 w-full max-w-2xl justify-center">
                <!-- Join Queue Button -->
                <button onclick="showView('view-queue')" class="flex-1 bg-[#1f2937] text-white rounded-xl p-10 hover:bg-gray-900 transition flex flex-col items-center justify-center shadow-lg group">
                    <svg class="w-10 h-10 mb-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <h3 class="text-xl font-bold mb-2">JOIN QUEUE</h3>
                    <p class="text-sm text-gray-400">Walk in & get your number</p>
                </button>

                <!-- Book Appointment Button -->
                <button onclick="showView('view-book')" class="flex-1 bg-[#3b82f6] text-white rounded-xl p-10 hover:bg-blue-600 transition flex flex-col items-center justify-center shadow-lg group">
                    <svg class="w-10 h-10 mb-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <h3 class="text-xl font-bold mb-2">BOOK APPOINTMENT</h3>
                    <p class="text-sm text-blue-100">Reserve your preferred time</p>
                </button>
            </div>
        </div>

        <!-- VIEW 2: Join Queue Form -->
        <div id="view-queue" class="hidden w-full max-w-lg bg-white rounded-xl shadow-md p-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-center mb-6 flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                Get Queue Number
            </h2>
            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Service *</label>
                    <select class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option>Gunting Rambut Biasa - 30m</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Barber (Optional)</label>
                    <select class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option>Any Barber</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name *</label>
                    <input type="text" placeholder="John Doe" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input type="text" placeholder="0123456789" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="button" class="w-full bg-[#111827] text-white py-3.5 rounded-lg font-bold hover:bg-gray-800 transition mt-6">JOIN QUEUE</button>
                <div class="text-center mt-4">
                    <button type="button" onclick="showView('view-menu')" class="text-gray-500 hover:text-gray-800 text-sm font-medium">Cancel</button>
                </div>
            </form>
        </div>

        <!-- VIEW 3: Book Appointment Form -->
        <div id="view-book" class="hidden w-full max-w-lg bg-white rounded-xl shadow-md p-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-center mb-6 flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Book Appointment
            </h2>
            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Service *</label>
                    <select class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option>Select Service</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Barber *</label>
                    <select class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option>Select Barber</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                        <input type="date" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Time *</label>
                        <input type="time" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name *</label>
                    <input type="text" placeholder="John Doe" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input type="text" placeholder="0123456789" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="button" class="w-full bg-[#111827] text-white py-3.5 rounded-lg font-bold hover:bg-gray-800 transition mt-6">CONFIRM BOOKING</button>
                <div class="text-center mt-4">
                    <button type="button" onclick="showView('view-menu')" class="text-gray-500 hover:text-gray-800 text-sm font-medium">Cancel</button>
                </div>
            </form>
        </div>

    </main>

    <script>
        // Fungsi mudah untuk tukar paparan form (macam dalam video)
        function showView(viewId) {
            document.getElementById('view-menu').classList.add('hidden');
            document.getElementById('view-queue').classList.add('hidden');
            document.getElementById('view-book').classList.add('hidden');
            
            document.getElementById(viewId).classList.remove('hidden');
        }
    </script>
</body>
</html>
