<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbershop - Customer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#111827', secondary: '#4B5563', accent: '#3B82F6' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .hidden-view { display: none !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center transform transition-all">
            <h3 id="alertTitle" class="text-lg font-bold text-gray-900 mb-2">Notice</h3>
            <p id="alertMessage" class="text-gray-600 mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-gray-800 transition">OK</button>
        </div>
    </div>

    <header id="mainHeader" class="bg-primary text-white py-4 px-6 shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider cursor-pointer" onclick="navigate('homeView')">BARBERSHOP</h1>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 w-full max-w-4xl mx-auto relative">
        
        <div id="homeView" class="w-full max-w-md glass-panel p-6 sm:p-8 text-center animate-fade-in transition-all">
            <img src="https://placehold.co/150x150/111827/ffffff?text=LOGO" alt="Logo" class="w-24 h-24 mx-auto rounded-full mb-6 shadow-lg">
            <h2 class="text-2xl font-bold mb-2 text-primary">Welcome</h2>
            <p class="text-gray-500 mb-8 text-sm">Please select an option below</p>
            
            <div class="grid gap-4">
                <button onclick="navigate('joinQueueView')" class="bg-primary text-white py-4 rounded-xl font-semibold shadow-md hover:bg-gray-800 hover:-translate-y-0.5 transition-all flex flex-col items-center justify-center">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    JOIN QUEUE
                </button>
                <button onclick="navigate('bookAppointmentView')" class="bg-white border-2 border-primary text-primary py-4 rounded-xl font-semibold shadow-sm hover:bg-gray-50 hover:-translate-y-0.5 transition-all flex flex-col items-center justify-center">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    BOOK APPOINTMENT
                </button>
                <button onclick="navigate('trackStatusView')" class="bg-gray-100 text-gray-700 py-3 rounded-xl font-medium shadow-sm hover:bg-gray-200 transition-all flex items-center justify-center">
                    CHECK STATUS
                </button>
            </div>
        </div>

        <div id="joinQueueView" class="w-full max-w-md glass-panel p-6 sm:p-8 hidden-view transition-all">
            <div class="flex items-center mb-6">
                <button onclick="navigate('homeView')" class="text-gray-500 hover:text-primary mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <h2 class="text-xl font-bold text-primary">Join Walk-in Queue</h2>
            </div>
            
            <form id="joinQueueForm" class="space-y-4" onsubmit="handleJoinQueue(event)">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name *</label>
                    <input type="text" id="qName" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input type="tel" id="qPhone" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Service *</label>
                    <select id="qService" required class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary outline-none">
                        <option value="">Loading services...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Preferred Barber (Optional)</label>
                    <select id="qBarber" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary outline-none">
                        <option value="Any">Any Available Barber</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">No. of People</label>
                        <input type="number" id="qPax" value="1" min="1" max="10" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes (Optional)</label>
                    <textarea id="qNotes" rows="2" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none"></textarea>
                </div>
                <button type="submit" id="btnJoinQueue" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-gray-800 transition-all mt-4">
                    GET QUEUE NUMBER
                </button>
            </form>
        </div>

        <div id="bookAppointmentView" class="w-full max-w-md glass-panel p-6 sm:p-8 hidden-view transition-all">
            <div class="flex items-center mb-6">
                <button onclick="navigate('homeView')" class="text-gray-500 hover:text-primary mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <h2 class="text-xl font-bold text-primary">Book Appointment</h2>
            </div>
            
            <form id="bookForm" class="space-y-4" onsubmit="handleBooking(event)">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name *</label>
                    <input type="text" id="bName" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input type="tel" id="bPhone" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                        <input type="date" id="bDate" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Time *</label>
                        <input type="time" id="bTime" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Service *</label>
                    <select id="bService" required class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary outline-none">
                        <option value="">Loading services...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Preferred Barber (Optional)</label>
                    <select id="bBarber" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-primary outline-none">
                        <option value="Any">Any Available Barber</option>
                    </select>
                </div>
                <button type="submit" id="btnBook" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-gray-800 transition-all mt-4">
                    CONFIRM BOOKING
                </button>
            </form>
        </div>

        <div id="trackStatusView" class="w-full max-w-md glass-panel p-6 sm:p-8 hidden-view transition-all">
            <div class="flex items-center mb-6">
                <button onclick="navigate('homeView')" class="text-gray-500 hover:text-primary mr-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <h2 class="text-xl font-bold text-primary">Check Status</h2>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Enter Queue No. or Booking ID</label>
                <div class="flex gap-2">
                    <input type="text" id="trackInput" placeholder="e.g. A023 or BK-2026..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none uppercase">
                    <button onclick="searchStatus()" class="bg-primary text-white px-5 rounded-lg font-semibold hover:bg-gray-800">Find</button>
                </div>
            </div>

            <div id="trackResult" class="hidden flex flex-col items-center bg-gray-50 p-6 rounded-xl border border-gray-200">
                <p class="text-sm text-gray-500 font-medium mb-1">YOUR NUMBER</p>
                <h1 id="trNumber" class="text-5xl font-black text-primary tracking-tighter mb-4">--</h1>
                
                <div id="trStatusBadge" class="px-4 py-1 rounded-full text-sm font-bold mb-6 bg-yellow-100 text-yellow-800">
                    WAITING
                </div>

                <div class="w-full space-y-3 text-sm">
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-gray-500">People Ahead</span>
                        <span id="trAhead" class="font-bold text-gray-900">-</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-gray-500">Est. Wait Time</span>
                        <span id="trWait" class="font-bold text-gray-900">-</span>
                    </div>
                    <div id="trCounterBox" class="hidden justify-between border-b pb-2 bg-green-50 p-2 rounded">
                        <span class="text-green-700 font-bold">Please proceed to</span>
                        <span id="trCounter" class="font-black text-green-700 text-lg">--</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-barber-app';
        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                const firebaseConfig = {
  apiKey: "AIzaSyBKVXr6MNUn6XiHCCRo69fiGa5BFmhHoSI",
  authDomain: "fullsystem-fbed2.firebaseapp.com",
  projectId: "fullsystem-fbed2",
  storageBucket: "fullsystem-fbed2.firebasestorage.app",
  messagingSenderId: "1074278839562",
  appId: "1:1074278839562:web:a2eddc8225c9d65c1076f3",
  measurementId: "G-4FYSBS81VH"
};
        } catch(e) {
            console.error("Config error, using mock config");
            firebaseConfig = {};
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const getCol = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);

        let currentUser = null;
        let servicesData = [];
        let barbersData = [];
        let queuesData = [];
        let trackingQueueId = null; 
        
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                console.log("Customer Auth Success:", currentUser.uid);
                setupRealtimeListeners();
            } catch (error) {
                console.error("Auth Error:", error);
                showModal("Error", "Failed to connect to the database. Please try refreshing.");
            }
        }

        function setupRealtimeListeners() {
            if (!currentUser) return;

            onSnapshot(getCol('services'), (snapshot) => {
                servicesData = [];
                snapshot.forEach(doc => servicesData.push({ id: doc.id, ...doc.data() }));
                populateDropdowns();
            }, (error) => console.error("Services Error:", error));

            onSnapshot(getCol('barbers'), (snapshot) => {
                barbersData = [];
                snapshot.forEach(doc => barbersData.push({ id: doc.id, ...doc.data() }));
                populateDropdowns();
            }, (error) => console.error("Barbers Error:", error));

            onSnapshot(getCol('queues'), (snapshot) => {
                queuesData = [];
                snapshot.forEach(doc => queuesData.push({ id: doc.id, ...doc.data() }));
                
                queuesData.sort((a, b) => {
                    let timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                    let timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                    return timeA - timeB;
                });

                updateTrackingUI();
            }, (error) => console.error("Queues Error:", error));
        }

        window.navigate = (viewId) => {
            const views = ['homeView', 'joinQueueView', 'bookAppointmentView', 'trackStatusView'];
            views.forEach(v => {
                const el = document.getElementById(v);
                if(el) el.classList.add('hidden-view');
            });
            
            const target = document.getElementById(viewId);
            if(target) target.classList.remove('hidden-view');
        };

        window.showModal = (title, message) => {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertModal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('alertModal').classList.add('hidden');
        };

        function populateDropdowns() {
            const activeServices = servicesData.filter(s => s.status !== 'Inactive');
            const activeBarbers = barbersData.filter(b => b.status !== 'Inactive');

            const sHtml = '<option value="">Select a service</option>' + activeServices.map(s => 
                `<option value="${s.id}" data-name="${s.name}" data-price="${s.price}">${s.name} - RM${s.price}</option>`
            ).join('');
            
            const bHtml = '<option value="Any">Any Available Barber</option>' + activeBarbers.map(b => 
                `<option value="${b.id}" data-name="${b.name}">${b.name}</option>`
            ).join('');

            const qService = document.getElementById('qService');
            const bService = document.getElementById('bService');
            const qBarber = document.getElementById('qBarber');
            const bBarber = document.getElementById('bBarber');

            if(qService) qService.innerHTML = sHtml;
            if(bService) bService.innerHTML = sHtml;
            if(qBarber) qBarber.innerHTML = bHtml;
            if(bBarber) bBarber.innerHTML = bHtml;
        }

        function generateQueueNumber() {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const todaysQueues = queuesData.filter(q => {
                if(!q.createdAt) return true;
                const qDate = new Date(q.createdAt.toMillis ? q.createdAt.toMillis() : Date.now());
                return qDate >= today;
            });

            let maxNum = 0;
            todaysQueues.forEach(q => {
                if(q.queueNumber && q.queueNumber.startsWith('A')) {
                    let num = parseInt(q.queueNumber.substring(1));
                    if(!isNaN(num) && num > maxNum) maxNum = num;
                }
            });

            const nextNum = maxNum + 1;
            return "A" + String(nextNum).padStart(3, '0');
        }

        window.handleJoinQueue = async (e) => {
            e.preventDefault();
            if(!currentUser) return showModal("Error", "Database connection not ready.");

            const btn = document.getElementById('btnJoinQueue');
            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            try {
                const sDropdown = document.getElementById('qService');
                const bDropdown = document.getElementById('qBarber');
                
                const sName = sDropdown.options[sDropdown.selectedIndex].getAttribute('data-name');
                const bName = bDropdown.value === 'Any' ? 'Any' : bDropdown.options[bDropdown.selectedIndex].getAttribute('data-name');

                const newQNumber = generateQueueNumber();

                const newDoc = {
                    queueNumber: newQNumber,
                    customerName: document.getElementById('qName').value,
                    phone: document.getElementById('qPhone').value,
                    serviceId: sDropdown.value,
                    serviceName: sName,
                    barberId: bDropdown.value,
                    barberName: bName,
                    pax: document.getElementById('qPax').value,
                    notes: document.getElementById('qNotes').value,
                    status: 'Waiting',
                    counter: '',
                    createdAt: serverTimestamp(),
                    type: 'Walk-in'
                };

                const docRef = await addDoc(getCol('queues'), newDoc);
                
                document.getElementById('joinQueueForm').reset();
                document.getElementById('trackInput').value = newQNumber;
                trackingQueueId = docRef.id;
                
                navigate('trackStatusView');
                searchStatus();
                showModal("Success", `Joined queue successfully! Your number is ${newQNumber}.`);

            } catch (err) {
                console.error(err);
                showModal("Error", "Failed to join queue. Try again.");
            } finally {
                btn.disabled = false;
                btn.innerText = "GET QUEUE NUMBER";
            }
        };

        window.handleBooking = async (e) => {
            e.preventDefault();
            if(!currentUser) return showModal("Error", "Database connection not ready.");

            const btn = document.getElementById('btnBook');
            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            try {
                const dateStr = document.getElementById('bDate').value;
                const yyyymmdd = dateStr.replace(/-/g, '');
                
                const randomId = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                const bookingId = `BK-${yyyymmdd}-${randomId}`;

                const sDropdown = document.getElementById('bService');
                const bDropdown = document.getElementById('bBarber');

                const newDoc = {
                    bookingNumber: bookingId,
                    customerName: document.getElementById('bName').value,
                    phone: document.getElementById('bPhone').value,
                    date: document.getElementById('bDate').value,
                    time: document.getElementById('bTime').value,
                    serviceId: sDropdown.value,
                    serviceName: sDropdown.options[sDropdown.selectedIndex].getAttribute('data-name'),
                    barberId: bDropdown.value,
                    barberName: bDropdown.value === 'Any' ? 'Any' : bDropdown.options[bDropdown.selectedIndex].getAttribute('data-name'),
                    status: 'Confirmed',
                    createdAt: serverTimestamp()
                };

                await addDoc(getCol('bookings'), newDoc);
                
                document.getElementById('bookForm').reset();
                navigate('homeView');
                showModal("Booking Confirmed", `Your Booking ID is ${bookingId}. \nDate: ${newDoc.date}\nTime: ${newDoc.time}\n\nPlease keep this ID to check status.`);

            } catch (err) {
                console.error(err);
                showModal("Error", "Failed to create booking.");
            } finally {
                btn.disabled = false;
                btn.innerText = "CONFIRM BOOKING";
            }
        };

        window.searchStatus = () => {
            const val = document.getElementById('trackInput').value.trim().toUpperCase();
            if(!val) return showModal("Input Error", "Please enter a Queue Number or Booking ID");

            if(val.startsWith('BK-')) {
                showModal("Info", "Booking status tracking requires backend implementation for privacy. For now, assume Confirmed if you received the ID.");
                return;
            }

            const today = new Date();
            today.setHours(0,0,0,0);
            
            const activeQueue = queuesData.find(q => {
                if(!q.createdAt) return false;
                const qDate = new Date(q.createdAt.toMillis ? q.createdAt.toMillis() : Date.now());
                return q.queueNumber === val && qDate >= today && q.status !== 'Completed' && q.status !== 'Cancelled';
            });

            if(!activeQueue) {
                document.getElementById('trackResult').classList.add('hidden');
                return showModal("Not Found", "Queue number not found or has been completed/cancelled for today.");
            }

            trackingQueueId = activeQueue.id;
            updateTrackingUI();
        };

        function updateTrackingUI() {
            if(!trackingQueueId) return;
            const myQueue = queuesData.find(q => q.id === trackingQueueId);
            
            if(!myQueue) return;

            const resDiv = document.getElementById('trackResult');
            resDiv.classList.remove('hidden');

            document.getElementById('trNumber').innerText = myQueue.queueNumber;
            
            const badge = document.getElementById('trStatusBadge');
            badge.innerText = myQueue.status.toUpperCase();
            
            badge.className = "px-4 py-1 rounded-full text-sm font-bold mb-6 ";
            if(myQueue.status === 'Waiting') badge.className += "bg-yellow-100 text-yellow-800";
            else if(myQueue.status === 'Called') badge.className += "bg-green-100 text-green-800";
            else if(myQueue.status === 'Serving') badge.className += "bg-blue-100 text-blue-800";
            else badge.className += "bg-gray-100 text-gray-800";

            if(myQueue.status === 'Waiting') {
                const today = new Date();
                today.setHours(0,0,0,0);
                let aheadCount = 0;
                
                const myTime = myQueue.createdAt?.toMillis ? myQueue.createdAt.toMillis() : Date.now();

                queuesData.forEach(q => {
                    const qTime = q.createdAt?.toMillis ? q.createdAt.toMillis() : Date.now();
                    const qDate = new Date(qTime);
                    if(qDate >= today && q.status === 'Waiting' && qTime < myTime) {
                        aheadCount++;
                    }
                });

                document.getElementById('trAhead').innerText = aheadCount;
                document.getElementById('trWait').innerText = `~${aheadCount * 20} mins`;
                document.getElementById('trCounterBox').classList.add('hidden');
                document.getElementById('trCounterBox').classList.remove('flex');
            } else {
                document.getElementById('trAhead').innerText = "0";
                document.getElementById('trWait').innerText = "None";
                
                if(myQueue.status === 'Called' || myQueue.status === 'Serving') {
                    const box = document.getElementById('trCounterBox');
                    box.classList.remove('hidden');
                    box.classList.add('flex');
                    document.getElementById('trCounter').innerText = myQueue.counter || 'Counter';
                }
            }
        }

        window.onload = initAuth;

    </script>
</body>
</html>
