<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbershop - Tempahan & Giliran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#0f172a', accent: '#3b82f6' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center animate-pulse">
            <div class="text-4xl mb-2">✂️</div>
            <div class="font-bold text-gray-800">Memuatkan Sistem...</div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center">
            <h3 id="alertTitle" class="text-xl font-bold text-gray-900 mb-2">Berjaya</h3>
            <p id="alertMessage" class="text-gray-600 mb-6 text-sm"></p>
            <button onclick="closeModal()" class="w-full bg-brand text-white py-2.5 rounded-lg font-semibold hover:bg-gray-800 transition">Tutup</button>
        </div>
    </div>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-brand p-6 text-center text-white">
            <div class="w-16 h-16 bg-accent rounded-full mx-auto flex items-center justify-center text-2xl shadow-lg mb-3">✂️</div>
            <h1 class="text-2xl font-bold tracking-wide">BARBERSHOP</h1>
            <p class="text-gray-300 text-sm mt-1">Sistem Tempahan & Tiket Giliran</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200">
            <button onclick="switchTab('queue')" id="tabQueue" class="flex-1 py-4 text-center tab-active transition">Ambil Giliran (Kini)</button>
            <button onclick="switchTab('book')" id="tabBook" class="flex-1 py-4 text-center tab-inactive transition">Tempah Awal</button>
        </div>

        <div class="p-6">
            <!-- QUEUE FORM -->
            <form id="formQueue" onsubmit="submitQueue(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Anda</label>
                    <input type="text" id="qName" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent" placeholder="Cth: Ahmad">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">No. Telefon</label>
                    <input type="tel" id="qPhone" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent" placeholder="0123456789">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Pilih Servis</label>
                    <select id="qService" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent bg-white">
                        <option value="">Memuatkan servis...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Pilih Barber (Pilihan)</label>
                    <select id="qBarber" class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent bg-white">
                        <option value="Any">Memuatkan barber...</option>
                    </select>
                </div>
                
                <button type="submit" id="btnQueue" class="w-full bg-accent text-white py-3.5 rounded-lg font-bold hover:bg-blue-600 transition shadow-md mt-4">
                    AMBIL TIKET GILIRAN
                </button>
            </form>

            <!-- BOOKING FORM -->
            <form id="formBook" onsubmit="submitBooking(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Anda</label>
                    <input type="text" id="bName" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent" placeholder="Cth: Ahmad">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">No. Telefon</label>
                    <input type="tel" id="bPhone" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent" placeholder="0123456789">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tarikh</label>
                        <input type="date" id="bDate" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Masa</label>
                        <input type="time" id="bTime" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Pilih Servis</label>
                    <select id="bService" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent bg-white">
                        <option value="">Memuatkan servis...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Pilih Barber (Pilihan)</label>
                    <select id="bBarber" class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-accent bg-white">
                        <option value="Any">Memuatkan barber...</option>
                    </select>
                </div>

                <button type="submit" id="btnBook" class="w-full bg-brand text-white py-3.5 rounded-lg font-bold hover:bg-gray-800 transition shadow-md mt-4">
                    SAHKAN TEMPAHAN
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js";

        // Guna config Firebase yang sama seperti Owner Portal
        const firebaseConfig = {
            apiKey: "AIzaSyBKVXr6MNUn6XiHCCRo69fiGa5BFmhHoSI",
            authDomain: "fullsystem-fbed2.firebaseapp.com",
            projectId: "fullsystem-fbed2",
            storageBucket: "fullsystem-fbed2.firebasestorage.app",
            messagingSenderId: "1074278839562",
            appId: "1:1074278839562:web:a2eddc8225c9d65c1076f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Kawalan Tab
        window.switchTab = (tab) => {
            if (tab === 'queue') {
                document.getElementById('formQueue').classList.remove('hidden');
                document.getElementById('formBook').classList.add('hidden');
                document.getElementById('tabQueue').className = 'flex-1 py-4 text-center tab-active transition';
                document.getElementById('tabBook').className = 'flex-1 py-4 text-center tab-inactive transition';
            } else {
                document.getElementById('formQueue').classList.add('hidden');
                document.getElementById('formBook').classList.remove('hidden');
                document.getElementById('tabBook').className = 'flex-1 py-4 text-center tab-active transition';
                document.getElementById('tabQueue').className = 'flex-1 py-4 text-center tab-inactive transition';
            }
        };

        window.closeModal = () => {
            document.getElementById('alertModal').classList.add('hidden');
            document.getElementById('formQueue').reset();
            document.getElementById('formBook').reset();
        };

        function showModal(title, msg) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('alertModal').classList.remove('hidden');
        }

        // Ambil Data Servis dan Barber secara "Live" semasa page dibuka
        async function loadDropdownData() {
            try {
                // Ambil Services
                const serviceSnap = await getDocs(collection(db, 'services'));
                let serviceHTML = '<option value="">-- Sila Pilih Servis --</option>';
                serviceSnap.forEach(doc => {
                    const data = doc.data();
                    serviceHTML += `<option value="${doc.id}" data-name="${data.name}">${data.name} (RM${data.price.toFixed(2)})</option>`;
                });
                
                // Masukkan ke dropdown form Queue & Book
                document.getElementById('qService').innerHTML = serviceHTML;
                document.getElementById('bService').innerHTML = serviceHTML;

                // Ambil Barbers
                const barberSnap = await getDocs(collection(db, 'barbers'));
                let barberHTML = '<option value="Any">Mana-mana Barber (Any)</option>';
                barberSnap.forEach(doc => {
                    const data = doc.data();
                    barberHTML += `<option value="${doc.id}" data-name="${data.name}">${data.name}</option>`;
                });

                // Masukkan ke dropdown form Queue & Book
                document.getElementById('qBarber').innerHTML = barberHTML;
                document.getElementById('bBarber').innerHTML = barberHTML;

                // Tutup Loading screen selepas data siap dimuat turun
                document.getElementById('loadingOverlay').classList.add('hidden');

            } catch (error) {
                console.error("Gagal muat data:", error);
                alert("Gagal berhubung ke pangkalan data. Sila refresh halaman.");
            }
        }

        // Jalankan fungsi load data
        loadDropdownData();

        // ------------------
        // SUBMIT GILIRAN
        // ------------------
        window.submitQueue = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnQueue');
            btn.disabled = true;
            btn.innerText = "Sila Tunggu...";

            try {
                const serviceEl = document.getElementById('qService');
                const barberEl = document.getElementById('qBarber');
                
                const sName = serviceEl.options[serviceEl.selectedIndex].getAttribute('data-name');
                const bName = barberEl.value === 'Any' ? 'Any' : barberEl.options[barberEl.selectedIndex].getAttribute('data-name');

                // Hasilkan nombor giliran automatik (cth: A-842)
                const ranNum = Math.floor(100 + Math.random() * 900);
                const qNumber = "A" + ranNum;

                const payload = {
                    customerName: document.getElementById('qName').value,
                    phone: document.getElementById('qPhone').value,
                    serviceId: serviceEl.value,
                    serviceName: sName,
                    barberId: barberEl.value,
                    barberName: bName,
                    queueNumber: qNumber,
                    status: 'Waiting',
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, 'queues'), payload);
                showModal("Tiket Berjaya Diambil!", `Nombor giliran anda ialah: ${qNumber}\nSila tunggu sehingga nombor anda dipanggil di skrin TV.`);

            } catch (error) {
                console.error(error);
                alert("Ralat semasa mengambil tiket giliran.");
            } finally {
                btn.disabled = false;
                btn.innerText = "AMBIL TIKET GILIRAN";
            }
        };

        // ------------------
        // SUBMIT TEMPAHAN
        // ------------------
        window.submitBooking = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnBook');
            btn.disabled = true;
            btn.innerText = "Sila Tunggu...";

            try {
                const serviceEl = document.getElementById('bService');
                const barberEl = document.getElementById('bBarber');
                
                const sName = serviceEl.options[serviceEl.selectedIndex].getAttribute('data-name');
                const bName = barberEl.value === 'Any' ? 'Any' : barberEl.options[barberEl.selectedIndex].getAttribute('data-name');

                const payload = {
                    customerName: document.getElementById('bName').value,
                    phone: document.getElementById('bPhone').value,
                    date: document.getElementById('bDate').value,
                    time: document.getElementById('bTime').value,
                    serviceId: serviceEl.value,
                    serviceName: sName,
                    barberId: barberEl.value,
                    barberName: bName,
                    status: 'Confirmed', // Boleh tukar ke 'Pending' jika perlukan admin approve dahulu
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, 'bookings'), payload);
                showModal("Tempahan Berjaya!", "Tempahan anda telah direkodkan ke dalam sistem kami. Terima kasih!");

            } catch (error) {
                console.error(error);
                alert("Ralat semasa menghantar tempahan.");
            } finally {
                btn.disabled = false;
                btn.innerText = "SAHKAN TEMPAHAN";
            }
        };
    </script>
</body>
</html>
